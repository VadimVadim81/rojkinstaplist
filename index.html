<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla On Tap</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-color: #800020; 
            --led-glow: #ffb703; 
            --gray-text: #999; 
        }
        
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(ellipse at 50% 0%, rgba(128, 0, 32, 0.15) 0%, #0a0a0a 40%, #000000 100%); 
            color: white; 
            font-family: 'Montserrat', sans-serif; font-weight: 600; 
            display: flex; flex-direction: column; align-items: center; 
            overflow: hidden; height: 100vh; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 96%; height: 10vh; position: relative; 
            border-bottom: 1px solid rgba(255, 183, 3, 0.25); 
            padding: 0 1vh;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(128,0,32,0.1) 0%, transparent 100%);
        }

        .rune-container { 
            width: 25%; display: flex; align-items: center; justify-content: flex-start; z-index: 10; cursor: default; 
            gap: 1vh;
        }
        #rune-symbol { font-size: 3.5vh; color: var(--led-glow); text-shadow: 0 0 12px rgba(255, 183, 3, 0.7); }
        #rune-info { display: flex; flex-direction: column; text-align: left; }
        #rune-label { font-size: 0.8vh; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }
        #rune-name { font-size: 1.4vh; font-weight: 700; color: #fff; text-transform: uppercase; }
        
        .main-title { 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            text-transform: uppercase; font-size: 3vh; letter-spacing: 0.1em; font-weight: 700; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 12px rgba(255, 183, 3, 0.35); color: #fff;
            cursor: pointer; user-select: none;
        }

        .logo { width: 25%; text-align: right; z-index: 10; display: flex; justify-content: flex-end; align-items: center; cursor: pointer; }
        
        #columns-container { display: flex; width: 96%; flex-grow: 1; justify-content: space-between; margin-top: 1.5vh; overflow: hidden; gap: 1vw; }
        .column { width: 49%; display: flex; flex-direction: column; }
        
        .tap-item { position: relative; display: flex; align-items: center; margin-bottom: 0.6vh; transition: opacity 0.2s; }
        
        .circled-number { 
            display: flex; align-items: center; justify-content: center; width: 4.5vh; height: 4.5vh; border-radius: 50%; 
            background: rgba(128, 0, 32, 0.3); border: 2px solid var(--accent-color); 
            color: #fff; font-size: 2.2vh; font-weight: 700; margin-right: 1.2vh; flex-shrink: 0; 
        }
        
        .tap-content { 
            position: relative; display: flex; justify-content: space-between; align-items: center; 
            background: rgba(18, 18, 18, 0.85); border: 1px solid #2a2a2a; border-radius: 1vh; 
            padding: 0 1.2vh; height: 10vh; flex-grow: 1; overflow: hidden;
        }
        
        /* Многострочное описание */
        .beer-info { display: flex; flex-direction: row; width: 70%; align-items: center; height: 100%; overflow: hidden; }
        .text-col { display: flex; flex-direction: column; flex-grow: 1; justify-content: center; height: 100%; overflow: hidden; }
        
        .name-input { font-size: 2.2vh; color: #fff; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .style-input { font-size: 1.2vh; color: #a0a0a0; font-weight: 500; line-height: 1.2; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8vh; }
        
        .brewery-row { display: flex; align-items: center; font-size: 1.3vh; color: #666; margin-top: 0.2vh; }
        .brewery-input { color: #ccc; font-weight: 600; text-transform: uppercase; border: none; background: transparent; }
        .val-highlight { color: #fff; font-weight: 700; }
        
        .price-column { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 25%; border-left: 1px solid #333; height: 100%; }
        
        /* Modal for Dialogs */
        .dialog-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .dialog-box { background: #1a1a1a; padding: 2vh; border-radius: 1vh; border: 1px solid #444; text-align: center; }
        .dialog-btns { margin-top: 2vh; display: flex; gap: 1vh; justify-content: center; }
        
        /* Responsive */
        @media screen and (max-width: 1024px) and (orientation: portrait), screen and (max-width: 650px) {
            body { height: auto; overflow: auto; }
            #columns-container { flex-direction: column; }
            .column { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="rune-container" id="rune-container">
            <div id="rune-symbol"></div>
            <div id="rune-info">
                <div id="rune-label">Руна недели:</div>
                <div id="rune-name"></div>
            </div>
        </div>
        <div class="main-title" id="title-trigger">СЕГОДНЯ НА КРАНАХ</div>
        <div class="logo" id="logo-container">
            <div class="editable" id="logo-text">V&V</div>
        </div>
    </header>

    <div id="columns-container">
        <div id="left-column" class="column"></div>
        <div id="right-column" class="column"></div>
    </div>

    <div id="custom-footer"></div>

    <!-- Custom Confirmation Modal -->
    <div id="dialog-overlay" class="dialog-overlay">
        <div class="dialog-box">
            <div id="dialog-msg" style="margin-bottom: 2vh;">Вы уверены?</div>
            <div class="dialog-btns">
                <button id="dialog-no" class="btn-control">Отмена</button>
                <button id="dialog-yes" class="btn-control btn-danger">Да</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCUIIMqq5cYhNgqUazJL_CxgvOhCrtwIi4",
          databaseURL: "https://rojkins-taplist-default-rtdb.europe-west1.firebasedatabase.app/",
          projectId: "rojkins-taplist"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        const dbRef = ref(db, 'valhallaMenu');
        
        let appData = { taps: [], footer: "Добро пожаловать!", logoText: "V&V" };
        let isEditMode = false;

        // Custom Dialog System
        function showDialog(msg, onYes) {
            const overlay = document.getElementById('dialog-overlay');
            document.getElementById('dialog-msg').innerText = msg;
            overlay.style.display = 'flex';
            document.getElementById('dialog-no').onclick = () => overlay.style.display = 'none';
            document.getElementById('dialog-yes').onclick = () => { overlay.style.display = 'none'; onYes(); };
        }

        function updateRune() {
            const runes = [{ s: "ᚠ", n: "Fehu" }, { s: "ᚢ", n: "Uruz" }, { s: "ᚦ", n: "Thurisaz" }, { s: "ᚨ", n: "Ansuz" }, { s: "ᚱ", n: "Raidho" }];
            const weekSeed = Math.floor(new Date().getTime() / 604800000);
            const rune = runes[weekSeed % runes.length];
            document.getElementById('rune-symbol').innerText = rune.s;
            document.getElementById('rune-name').innerText = rune.n;
        }
        updateRune();

        function render() {
            const lCol = document.getElementById('left-column');
            const rCol = document.getElementById('right-column');
            lCol.innerHTML = ''; rCol.innerHTML = '';

            (appData.taps || []).slice(0, 12).forEach((t, i) => {
                // Brewery field logic: empty if no value and not edit mode
                const breweryDisplay = (t.brewery || "").toUpperCase();
                const breweryStyle = (isEditMode || breweryDisplay) ? "" : "display:none;";
                
                const html = `
                <div class="tap-item">
                    <div class="circled-number">${t.number}</div>
                    <div class="tap-content">
                        <div class="beer-info">
                            <div class="text-col">
                                <div class="name-input" contenteditable="${isEditMode}" onblur="updateTap(${i}, 'name', this.innerText)">${t.name||''}</div>
                                <div class="style-input" contenteditable="${isEditMode}" onblur="updateTap(${i}, 'style', this.innerText)">${t.style||''}</div>
                                <div class="brewery-row" style="${breweryStyle}">
                                    <input class="brewery-input" style="${isEditMode?'':'pointer-events:none'}" value="${breweryDisplay}" onblur="updateTap(${i}, 'brewery', this.value.toUpperCase())">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
                if (i < 6) lCol.innerHTML += html; else rCol.innerHTML += html;
            });
        }

        window.updateTap = (i, field, val) => {
            if (!appData.taps[i]) appData.taps[i] = {};
            appData.taps[i][field] = val;
            save();
            render();
        };

        function save() {
            set(dbRef, appData);
        }

        onValue(dbRef, snap => {
            const val = snap.val();
            if (val) {
                appData = val;
                if (!appData.taps || appData.taps.length === 0) {
                     appData.taps = Array.from({length:12}, (_,i)=>({number:i+1, name:"", style:"", brewery:""}));
                }
                render();
            }
        });
        
        document.getElementById('title-trigger').onclick = () => {
             if (isEditMode) showDialog("Выйти из режима редактирования?", () => { isEditMode = false; render(); });
             else isEditMode = true; render();
        };

    </script>
</body>
</html>
