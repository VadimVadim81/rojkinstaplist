<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla On Tap</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent-color: #800020; --gray-text: #999; }
        
        body { 
            margin: 0; padding: 0; background-color: black; color: white; 
            font-family: 'Montserrat', sans-serif; font-weight: 600; 
            display: flex; flex-direction: column; align-items: center; 
            overflow: hidden; height: 100vh; 
        }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 96%; height: 14vh; position: relative; margin-top: 1vh; 
            border-bottom: 2px solid rgba(128,0,32,0.3); padding-bottom: 1vh; 
        }
        
        .logo { 
            width: 25%; text-align: right; z-index: 10; display: flex; 
            justify-content: flex-end; align-items: center; cursor: pointer; transition: opacity 0.2s; 
        }
        .logo:hover { opacity: 0.8; }
        #logo-text { font-weight: 700; font-size: 3vh; color: var(--accent-color); text-transform: uppercase; }
        #logo-img { max-height: 12vh; max-width: 100%; object-fit: contain; display: none; filter: drop-shadow(0px 0px 6px rgba(255, 255, 255, 0.8)); }
        
        .main-title { 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            text-transform: uppercase; font-size: 4vh; letter-spacing: 0.15em; 
            font-weight: 700; text-align: center; white-space: nowrap; margin: 0; 
            cursor: pointer; user-select: none; z-index: 20; color: #fff;
        }
        
        #columns-container { 
            display: flex; width: 98%; flex-grow: 1; justify-content: space-between; 
            margin-top: 2vh; overflow: hidden; padding: 0 1%;
        }
        .column { width: 49%; display: flex; flex-direction: column; }
        
        .tap-item { position: relative; display: flex; align-items: center; margin-bottom: 1.2vh; transition: opacity 0.2s; }
        
        .circled-number { 
            display: flex; align-items: center; justify-content: center; 
            width: 5.5vh; height: 5.5vh; border-radius: 50%; 
            background: rgba(128, 0, 32, 0.15); border: 3px solid rgba(128, 0, 32, 0.8); 
            color: #fff; font-size: 2.5vh; font-weight: 700; margin-right: 1.5vh; flex-shrink: 0; 
        }
        
        .tap-content { 
            position: relative; display: flex; justify-content: space-between; align-items: center; 
            background: #111; border: 1px solid #333; border-radius: 1.5vh; 
            padding: 0 2vh; height: 11.5vh; box-sizing: border-box; flex-grow: 1; 
            transition: border 0.2s; box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
        }
        
        .tap-menu-container { position: absolute; top: 0.5vh; right: 0.8vh; z-index: 35; display: none; }
        body.edit-mode .tap-menu-container { display: block; }
        .tap-menu-btn { color: #555; font-size: 3vh; cursor: pointer; padding: 0 5px; }
        
        .stop-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.75); z-index: 10; pointer-events: none; border-radius: 1.5vh; 
        }
        .stop-text { color: #fff; font-size: 2.5vh; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
        
        .beer-info { display: flex; flex-direction: row; flex: 1; align-items: center; height: 100%; overflow: hidden; }
        
        .brewery-logo-wrapper { 
            position: relative; width: 8vh; height: 8vh; margin-right: 2vh; 
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; 
        }
        .brewery-logo-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .text-col { display: flex; flex-direction: column; flex: 1; overflow: hidden; justify-content: center; }
        
        .name-input { font-size: 3.2vh; color: #fff; line-height: 1.1; font-weight: 700; margin-bottom: 0.5vh; text-transform: uppercase; }
        .style-input { font-size: 1.8vh; color: #bbb; font-weight: 500; margin-bottom: 0.5vh; }
        .beer-details-row { display: flex; align-items: center; font-size: 1.6vh; color: #888; gap: 1vh; }
        .brewery-input { font-size: 1.7vh; color: #ddd; font-weight: 600; width: auto; flex: 0 1 auto; }
        .val-highlight { font-size: 1.9vh; color: #fff; font-weight: 700; }
        
        .price-column { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            width: 18%; text-align: center; border-left: 1px solid rgba(255,255,255,0.1); height: 70%; 
        }
        .price-wrapper { display: flex; align-items: baseline; font-size: 3.5vh; color: #fff; font-weight: 700; }
        .price-label-text { font-size: 1.2vh; color: #777; text-transform: uppercase; margin-top: 0.5vh; font-weight: 700; letter-spacing: 0.05em; }
        
        .glass-select { 
            background: transparent; color: #888; border: none; font-family: inherit; 
            font-size: 1.3vh; font-weight: 700; cursor: pointer; text-transform: uppercase; 
        }

        #custom-footer { width: 96%; margin: 1vh 0; padding: 1vh; font-size: 2.5vh; color: #fff; text-align: center; font-weight: 700; }
        
        /* Modals and Admin */
        #admin-menu-wrapper { position: fixed; bottom: 2vh; right: 2vh; display: none; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 100; }
        body.edit-mode #admin-menu-wrapper { display: flex; }
    </style>
</head>
<body>

    <header>
        <div style="width: 25%;"></div> 
        <div class="main-title" id="title-trigger">СЕГОДНЯ НА КРАНАХ</div>
        <div class="logo" id="logo-container">
            <input type="file" id="logo-file-input" style="display:none" accept="image/*">
            <img id="logo-img" src="">
            <div class="editable" contenteditable="false" id="logo-text">V&V</div>
        </div>
    </header>

    <div id="columns-container">
        <div id="left-column" class="column"></div>
        <div id="right-column" class="column"></div>
    </div>

    <div id="custom-footer" class="editable" contenteditable="false"></div>

    <div id="admin-menu-wrapper">
        <div id="admin-actions-list" style="display: none; flex-direction: column; gap: 6px; background: rgba(20,20,20,0.95); padding: 10px; border-radius: 8px; border: 1px solid #333; margin-bottom: 10px;">
            <button class="btn-control" id="manage-logos-btn" style="background: #222; color: #fff; border: 1px solid #444; padding: 10px; cursor: pointer;">🖼️ Управление логотипами</button>
            <button class="btn-control btn-danger" id="clear-names-btn" style="background: #222; color: #ffadad; border: 1px solid #600; padding: 10px; cursor: pointer;">🧹 Очистить базу</button>
        </div>
        <button class="btn-main-menu" id="main-admin-btn" style="background: #1a1a1a; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 8px; cursor: pointer;">🛠️ Меню</button>
    </div>

    <div id="logo-modal" class="stop-overlay admin-modal" style="display: none; pointer-events: auto;">
        <div class="modal-content-box">
            <button class="btn-close-x" onclick="document.getElementById('logo-modal').style.display='none'">×</button>
            <h3 style="margin-top:0;">Логотипы</h3>
            <button class="btn-control" onclick="document.getElementById('modal-logo-upload').click()">➕ Загрузить</button>
            <div id="logo-list" style="margin-top: 2vh;"></div>
        </div>
    </div>

    <datalist id="dl-names"></datalist>
    <datalist id="dl-breweries"></datalist>
    <input type="file" id="quick-logo-upload" style="display:none" accept="image/*">
    <input type="file" id="modal-logo-upload" style="display:none" accept="image/*">
    <div id="save-status" style="position: fixed; bottom: 2vh; left: 2vh; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px; display: none; font-size: 1.5vh;">Сохранено</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const cloudinaryCloudName = "dxwldkm95"; 
        const cloudinaryUploadPreset = "vahataplist";

        const firebaseConfig = {
          apiKey: "AIzaSyCUIIMqq5cYhNgqUazJL_CxgvOhCrtwIi4",
          authDomain: "rojkins-taplist.firebaseapp.com",
          databaseURL: "https://rojkins-taplist-default-rtdb.europe-west1.firebasedatabase.app/",
          projectId: "rojkins-taplist",
          storageBucket: "rojkins-taplist.firebasestorage.app",
          messagingSenderId: "174231207339",
          appId: "1:174231207339:web:99217e986e853dce8766ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'valhallaMenu');

        const adminWrapper = document.getElementById('admin-menu-wrapper');
        const mainAdminBtn = document.getElementById('main-admin-btn');
        const adminActionsList = document.getElementById('admin-actions-list');
        const logoImg = document.getElementById('logo-img');
        const logoTxt = document.getElementById('logo-text');
        const saveStatus = document.getElementById('save-status');

        let deviceId = localStorage.getItem('valhalla_device_id') || ('dev_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('valhalla_device_id', deviceId);

        let isApproved = false, isEditMode = false, pendingTapIndex = null;
        let appData = { taps: [], footer: "Добро пожаловать!", logoText: "V&V", knownNames: [], knownBreweries: [], breweryLogos: {} };

        onValue(ref(db, `approved_devices/${deviceId}`), snap => isApproved = snap.exists());

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', cloudinaryUploadPreset);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryCloudName}/image/upload`, {
                method: 'POST', body: formData
            });
            const data = await res.json();
            return data.secure_url;
        }

        document.getElementById('logo-container').onclick = () => isEditMode && document.getElementById('logo-file-input').click();
        document.getElementById('logo-file-input').onchange = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            try {
                appData.logoBase64 = await uploadToCloudinary(file);
                save(); render();
            } catch (err) { alert("Ошибка загрузки!"); }
        };

        mainAdminBtn.onclick = e => {
            e.stopPropagation();
            const show = adminActionsList.style.display === 'none';
            adminActionsList.style.display = show ? 'flex' : 'none';
        };

        document.getElementById('manage-logos-btn').onclick = () => {
            renderLogoManager(); 
            document.getElementById('logo-modal').style.display = 'flex';
        };

        function renderLogoManager() {
            const list = document.getElementById('logo-list'); list.innerHTML = '';
            Object.entries(appData.breweryLogos || {}).forEach(([name, url]) => {
                list.innerHTML += `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; background:#222; padding:10px; border-radius:5px;">
                    <img src="${url}" style="width:40px; height:40px; object-fit:contain; margin-right:10px;">
                    <span>${name}</span>
                    <button onclick="deleteLogo('${name}')" style="background:red; color:white; border:none; padding:5px 10px; cursor:pointer;">🗑️</button>
                </div>`;
            });
        }

        window.deleteLogo = name => {
            if (confirm("Удалить логотип?")) {
                delete appData.breweryLogos[name];
                appData.taps.forEach(t => { if(t.breweryLogoName === name) t.breweryLogoName = ""; });
                save(); render(); renderLogoManager();
            }
        };

        async function handleQuickLogo(e) {
            const file = e.target.files[0]; if (!file) return;
            const name = prompt("Название пивоварни:");
            if (name) {
                const url = await uploadToCloudinary(file);
                if (!appData.breweryLogos) appData.breweryLogos = {};
                appData.breweryLogos[name] = url;
                if (pendingTapIndex !== null) appData.taps[pendingTapIndex].breweryLogoName = name;
                save(); render(); renderLogoManager();
            }
        }
        document.getElementById('modal-logo-upload').onchange = handleQuickLogo;
        document.getElementById('quick-logo-upload').onchange = handleQuickLogo;

        document.getElementById('title-trigger').onclick = () => {
            if (isEditMode) {
                if (confirm("Выйти из редактирования?")) {
                    isEditMode = false; document.body.classList.remove('edit-mode'); render();
                }
            } else if (isApproved) {
                isEditMode = true; document.body.classList.add('edit-mode'); render();
            } else {
                const name = prompt("Доступ:");
                if (name) fetch('/api/request-access', { method: 'POST', body: JSON.stringify({ deviceId, name }) });
            }
        };

        onValue(dbRef, snap => {
            const val = snap.val();
            if (val) {
                appData = { ...appData, ...val, taps: val.taps || [] };
                if (appData.taps.length === 0) {
                    for(let i=1; i<=12; i++) appData.taps.push({number:i, name:"", brewery:"", style:"", abv:"", ibu:"", glassPrice:"", glassLabel:"Бокал 0,5", litrePrice:"", isStopped: true, breweryLogoName:""});
                    save();
                }
                render();
            }
        });

        function save() {
            set(dbRef, appData).then(() => {
                saveStatus.style.display = 'block';
                setTimeout(() => saveStatus.style.display = 'none', 1000);
            });
        }

        function render() {
            if (appData.logoBase64) { logoImg.src = appData.logoBase64; logoImg.style.display = 'block'; logoTxt.style.display = 'none'; }
            else { logoImg.style.display = 'none'; logoTxt.style.display = 'block'; logoTxt.innerText = appData.logoText || "V&V"; }

            const footerEl = document.getElementById('custom-footer');
            footerEl.innerText = appData.footer || "";
            footerEl.contentEditable = isEditMode;

            const lCol = document.getElementById('left-column'), rCol = document.getElementById('right-column');
            lCol.innerHTML = ''; rCol.innerHTML = '';

            appData.taps.slice(0, 12).forEach((t, i) => {
                const isStopped = t.isStopped === true;
                const logoSrc = t.breweryLogoName && appData.breweryLogos ? appData.breweryLogos[t.breweryLogoName] : '';
                let logoOptions = `<option value="">Нет лого</option>`;
                Object.keys(appData.breweryLogos || {}).forEach(k => logoOptions += `<option value="${k}" ${t.breweryLogoName===k?'selected':''}>${k}</option>`);
                logoOptions += `<option value="__UPLOAD__">➕ Загрузить...</option>`;

                const html = `<div class="tap-item" data-i="${i}">
                    <div class="circled-number">${t.number}</div>
                    <div class="tap-content">
                        ${isStopped ? '<div class="stop-overlay"><div class="stop-text">СКОРО ТУТ БУДЕТ ПИВО</div></div>' : ''}
                        <div class="tap-menu-container">
                            <div class="tap-menu-btn" onclick="toggleTapMenu(${i})">⋮</div>
                            <div class="tap-context-menu" id="menu-${i}" style="display:none; position:absolute; right:0; background:#1a1a1a; border:1px solid #444; z-index:100;">
                                <button onclick="toggleStop(${i})" style="display:block; width:100%; padding:10px; background:none; color:white; border:none; text-align:left;">${isStopped ? 'Вкл' : 'Выкл'}</button>
                                <button onclick="clearTap(${i})" style="display:block; width:100%; padding:10px; background:none; color:red; border:none; text-align:left;">Очистить</button>
                            </div>
                        </div>
                        <div class="beer-info ${isStopped ? 'blurred-content' : ''}">
                            <div class="brewery-logo-wrapper">
                                ${logoSrc ? `<img src="${logoSrc}" class="brewery-logo-img">` : `<div class="logo-placeholder"></div>`}
                                ${isEditMode ? `<select class="brewery-logo-select" onchange="changeLogo(${i}, this.value)">${logoOptions}</select>` : ''}
                            </div>
                            <div class="text-col">
                                <input type="text" class="editable-input name-input" value="${t.name||''}" placeholder="НАЗВАНИЕ" onblur="updateTap(${i}, 'name', this.value)" ${!isEditMode?'readonly':''}>
                                <input type="text" class="editable-input style-input" value="${t.style||''}" placeholder="Описание" onblur="updateTap(${i}, 'style', this.value)" ${!isEditMode?'readonly':''}>
                                <div class="beer-details-row">
                                    <input type="text" class="editable-input brewery-input" value="${t.brewery||''}" placeholder="Пивоварня" onblur="updateTap(${i}, 'brewery', this.value)" ${!isEditMode?'readonly':''}>
                                    <span>|</span> ABV <span class="val-highlight">${t.abv||'0'}%</span>
                                    <span>|</span> IBU <span class="val-highlight">${t.ibu||'0'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="price-column ${isStopped ? 'blurred-content' : ''}">
                            <div class="price-wrapper"><input type="text" class="editable-input" style="text-align:center; width:100%; font-size:3.5vh;" value="${t.glassPrice||''}" onblur="updateTap(${i}, 'glassPrice', this.value)" ${!isEditMode?'readonly':''}></div>
                            <div class="price-label-text">${t.glassLabel || 'Бокал 0,5'}</div>
                        </div>
                        <div class="price-column ${isStopped ? 'blurred-content' : ''}">
                            <div class="price-wrapper"><input type="text" class="editable-input" style="text-align:center; width:100%; font-size:3.5vh;" value="${t.litrePrice||''}" onblur="updateTap(${i}, 'litrePrice', this.value)" ${!isEditMode?'readonly':''}></div>
                            <div class="price-label-text">1 Л. НАВЫНОС</div>
                        </div>
                    </div>
                </div>`;
                if (i < 6) lCol.innerHTML += html; else rCol.innerHTML += html;
            });
            rCol.appendChild(adminWrapper);
        }

        window.toggleTapMenu = i => {
            const m = document.getElementById(`menu-${i}`);
            m.style.display = m.style.display === 'none' ? 'block' : 'none';
        };

        window.updateTap = (i, field, val) => {
            appData.taps[i][field] = val;
            save();
        };

        window.changeLogo = (i, val) => {
            if (val === '__UPLOAD__') {
                pendingTapIndex = i;
                document.getElementById('quick-logo-upload').click();
            } else {
                appData.taps[i].breweryLogoName = val;
                save(); render();
            }
        };

        window.toggleStop = i => {
            appData.taps[i].isStopped = !appData.taps[i].isStopped;
            save(); render();
        };

        window.clearTap = i => {
            appData.taps[i] = { ...appData.taps[i], name:"", brewery:"", style:"", isStopped: true };
            save(); render();
        };

        document.getElementById('custom-footer').onblur = function() {
            appData.footer = this.innerText;
            save();
        };
    </script>
</body>
</html>
